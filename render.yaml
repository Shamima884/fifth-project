# Render Blueprint: RxSpark web service
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rxspark
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: RXSPARK_DEBUG
        value: "0"
      - key: RXSPARK_DEMO_MODE
        value: "1"
      # Auto-generated by Render; keeps sessions valid across restarts.
      - key: RXSPARK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7

