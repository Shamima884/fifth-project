{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="auth-box">
  <div class="card">
    <h1 style="margin-top:0; font-size:20px;">Reset your password</h1>
    <p class="hint">Enter your account email and we'll send a reset link
      (valid for 30 minutes).</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email <span class="req">*</span></label>
      <input type="email" id="email" name="email" required autofocus>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Send reset link</button>
      </div>
    </form>
    <p class="auth-alt"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
  </div>
</div>
{% endblock %}
