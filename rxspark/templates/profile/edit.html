{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Profile &amp; settings</h1>
</div>

<div class="grid grid-2">
  <div class="card">
    <h2>Professional profile</h2>
    <form method="post" action="{{ url_for('profile.edit_profile') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <div>
          <label for="name">Full name <span class="req">*</span></label>
          <input type="text" id="name" name="name" required maxlength="120"
                 value="{{ doctor.name }}">
        </div>
        <div>
          <label for="title">Title</label>
          <input type="text" id="title" name="title" maxlength="120"
                 placeholder="Consultant Physician" value="{{ doctor.title }}">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label for="degree">Degree</label>
          <input type="text" id="degree" name="degree" maxlength="200"
                 placeholder="MBBS, FCPS" value="{{ doctor.degree }}">
        </div>
        <div>
          <label for="specialty">Specialty</label>
          <input type="text" id="specialty" name="specialty" maxlength="120"
                 value="{{ doctor.specialty }}">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label for="bmdc_registration_number">BMDC no.</label>
          <input type="text" id="bmdc_registration_number"
                 name="bmdc_registration_number" maxlength="60"
                 value="{{ doctor.bmdc_registration_number }}">
        </div>
        <div>
          <label for="clinic_name">Clinic name</label>
          <input type="text" id="clinic_name" name="clinic_name" maxlength="200"
                 value="{{ doctor.clinic_name }}">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label for="phone">Phone</label>
          <input type="text" id="phone" name="phone" maxlength="30"
                 value="{{ doctor.phone }}">
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" maxlength="254"
                 value="{{ doctor.email }}">
        </div>
      </div>
      <label for="address">Address</label>
      <input type="text" id="address" name="address" maxlength="400"
             value="{{ doctor.address }}">
      <div class="form-row">
        <div>
          <label for="photo_url">Photo URL</label>
          <input type="url" id="photo_url" name="photo_url" maxlength="500"
                 value="{{ doctor.photo_url or '' }}">
        </div>
        <div>
          <label for="signature_url">Signature URL</label>
          <input type="url" id="signature_url" name="signature_url" maxlength="500"
                 value="{{ doctor.signature_url or '' }}">
        </div>
        <div>
          <label for="clinic_logo_url">Clinic logo URL</label>
          <input type="url" id="clinic_logo_url" name="clinic_logo_url" maxlength="500"
                 value="{{ doctor.clinic_logo_url or '' }}">
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Save profile</button>
      </div>
    </form>
  </div>

  <div>
    <div class="card">
      <h2>Preferences</h2>
      <form method="post" action="{{ url_for('profile.update_settings') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="language">Language</label>
        <select id="language" name="language">
          {% for l in languages %}
          <option value="{{ l }}" {% if settings.language == l %}selected{% endif %}>{{ l|upper }}</option>
          {% endfor %}
        </select>
        <label for="date_format">Date format</label>
        <select id="date_format" name="date_format">
          {% for f in date_formats %}
          <option value="{{ f }}" {% if settings.date_format == f %}selected{% endif %}>{{ f }}</option>
          {% endfor %}
        </select>
        <label for="prescription_template">Prescription template</label>
        <select id="prescription_template" name="prescription_template">
          {% for t in templates %}
          <option value="{{ t }}" {% if settings.prescription_template == t %}selected{% endif %}>{{ t|capitalize }}</option>
          {% endfor %}
        </select>
        <div class="actions">
          <button class="btn btn-primary" type="submit">Save settings</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Change password</h2>
      <form method="post" action="{{ url_for('profile.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="current_password">Current password</label>
        <input type="password" id="current_password" name="current_password" required>
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" required minlength="8">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
        <div class="actions">
          <button class="btn" type="submit">Change password</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
